[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hd-clearance-monitor"
version = "0.3.0"
description = "Track Home Depot clearance, price drops and stock for any brand at your local stores"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "structlog>=24.0",
    "rich",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dashboard = ["nicegui>=2.0"]
dev = [
    "httpx",  # test doubles only; the scanner itself sends through curl
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]

[project.scripts]
hd = "hd.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, unused imports/variables.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules re-export names so older imports keep working.
"src/hd/pipeline/browse.py" = ["F401"]
"src/hd/dashboard/queries.py" = ["F401"]
"src/hd/cli/__init__.py" = ["F401"]
"src/hd/setup_wizard.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
# Type-checked strictly where the code is new; older modules are covered by tests.
files = [
  "src/hd/notifiers/base.py",
  "src/hd/notifiers/channels.py",
  "src/hd/notifiers/rules.py",
  "src/hd/notifiers/dedupe.py",
  "src/hd/notifiers/dispatch.py",
  "src/hd/retailers",
  "src/hd/hd_api/schema.py",
  "src/hd/init_flow.py",
  "src/hd/pipeline/confidence.py",
  "src/hd/pipeline/tiering.py",
  "src/hd/pipeline/normalizer.py",
  "src/hd/http/softblock.py",
  "src/hd/http/rate_limit.py",
  "src/hd/network_doctor.py",
]

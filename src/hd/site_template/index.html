<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clearance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Clearance Watch</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --muted: #6b6860;
    --line: #e4e1da; --accent: #c2410c; --good: #166534; --warn-bg: #fef3c7;
    --warn-ink: #78350f; --warn-line: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --card: #1f1e1b; --ink: #f1efe9; --muted: #a09c92;
      --line: #33312c; --accent: #fb923c; --good: #4ade80; --warn-bg: #3a2a08;
      --warn-ink: #fde68a; --warn-line: #b45309;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .banner {
    background: var(--warn-bg); color: var(--warn-ink);
    border-left: 4px solid var(--warn-line); border-radius: 6px;
    padding: 12px 14px; margin: 0 0 16px; font-size: 14px;
  }
  .banner strong { display: block; margin-bottom: 4px; }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
  .tabs button {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .deal {
    display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; margin: 0 0 10px; text-decoration: none;
    color: inherit;
  }
  .deal img {
    width: 72px; height: 72px; object-fit: contain; border-radius: 6px;
    background: #fff; flex: none;
  }
  .deal .body { min-width: 0; flex: 1; }
  .deal .title { font-weight: 600; font-size: 15px; margin: 0 0 4px; }
  .price { font-size: 20px; font-weight: 700; color: var(--accent); }
  .was { color: var(--muted); font-size: 14px; margin-left: 6px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--good); margin-left: 6px;
  }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px;
    border-radius: 999px; margin-left: 6px; vertical-align: middle;
    border: 1px solid var(--line); color: var(--muted);
  }
  .badge.high { color: var(--good); border-color: var(--good); }
  .badge.low { color: var(--warn-ink); border-color: var(--warn-line); background: var(--warn-bg); }
  .flag { color: var(--warn-ink); background: var(--warn-bg); border-radius: 4px;
    padding: 1px 6px; font-size: 12px; }
  .filter { display: flex; align-items: center; gap: 8px; margin: 0 0 14px;
    font-size: 14px; color: var(--muted); }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }
  .worth { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin: 0 0 14px; }
  .worth h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); }
  .wrow { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .wrow:first-of-type { border-top: 0; }
  .verdict { font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .verdict.yes { color: var(--good); border-color: var(--good); }
  .deal { flex-direction: column; }
  .deal .row { display: flex; gap: 12px; text-decoration: none; color: inherit; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions button, .actions a, .sheet button, .sheet a.btn {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-decoration: none;
  }
  .actions button.primary, .sheet button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px;
    padding: 0; cursor: pointer; text-decoration: underline; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: flex-end; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0;
    padding: 18px 18px 26px; max-height: 92vh; overflow: auto; }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; }
  .sheet .big { font-size: 34px; font-weight: 800; color: var(--accent); }
  .sheet .barcode { background: #fff; border-radius: 8px; padding: 8px; margin: 12px 0; }
  .sheet .barcode svg { width: 100%; height: auto; display: block; }
  .sheet .kv { color: var(--muted); font-size: 14px; margin: 2px 0; }
  .sheet .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .install { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>Clearance Watch</h1>
  <p class="sub" id="sub">Loading the latest scan…</p>
  <div id="banners"></div>
  <label class="filter" id="filter" hidden><input type="checkbox" id="nobs" checked>
    <span id="nobs-label">Hide low-confidence stock</span></label>
  <p class="install" id="install" hidden>
    <button class="link" id="install-btn">Install this on your phone</button> for a one-tap app that works offline.</p>
  <div class="worth" id="worth" hidden></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="install" id="hidden-note" hidden>
    <button class="link" id="hidden-toggle"></button></p>
  <div id="deals"></div>
  <footer id="foot"></footer>
</main>
<div class="overlay" id="hunter" role="dialog" aria-modal="true" aria-label="Deal card">
  <div class="sheet" id="sheet"></div>
</div>
<script src="barcode.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  var money = function (v) {
    return v == null ? null : "$" + Number(v).toLocaleString("en-US",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  var when = function (iso) {
    if (!iso) return "unknown";
    return new Date(iso).toLocaleString("en-US", {
      timeZone: "America/New_York", month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit"
    }) + " ET";
  };
  var ago = function (iso) {
    var mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 60) return mins + " min ago";
    if (mins < 2880) return Math.round(mins / 60) + " h ago";
    return Math.round(mins / 1440) + " days ago";
  };
  var banner = function (title, items) {
    var b = el("div", "banner");
    b.appendChild(el("strong", null, title));
    if (items && items.length) {
      var ul = el("ul");
      items.forEach(function (t) { ul.appendChild(el("li", null, t)); });
      b.appendChild(ul);
    }
    $("banners").appendChild(b);
  };

  var data = null, current = null;
  var hideLow = true;
  try { if (localStorage.getItem("hideLow") === "0") hideLow = false; } catch (e) {}

  // ── 48 h "not on the shelf" memory. Per phone, per browser: there is no
  // server to tell, so this never changes what the scanner or other devices see.
  var GHOST_MS = 48 * 3600 * 1000;
  var showHidden = false;
  function ghostKey(store, d) { return store.id + ":" + d.item_id; }
  function readGhosts() {
    var raw = {};
    try { raw = JSON.parse(localStorage.getItem("ghosts") || "{}"); } catch (e) {}
    var now = Date.now(), live = {};
    Object.keys(raw).forEach(function (k) { if (raw[k] > now) live[k] = raw[k]; });
    return live;
  }
  function writeGhosts(g) { try { localStorage.setItem("ghosts", JSON.stringify(g)); } catch (e) {} }
  function setGhost(store, d, on) {
    var g = readGhosts();
    if (on) g[ghostKey(store, d)] = Date.now() + GHOST_MS; else delete g[ghostKey(store, d)];
    writeGhosts(g);
  }
  function isGhost(store, d) { return !!readGhosts()[ghostKey(store, d)]; }

  function confident(store) {
    if (!hideLow || !data.no_bs || !data.no_bs.enabled) return store.deals;
    return store.deals.filter(function (d) {
      return !d.confidence || d.confidence.score >= data.no_bs.minimum;
    });
  }
  function visible(store) {
    return confident(store).filter(function (d) { return showHidden || !isGhost(store, d); });
  }
  function hiddenCount(store) {
    return confident(store).filter(function (d) { return isGhost(store, d); }).length;
  }

  function safeLink(a, url, pattern) {
    if (pattern.test(url || "")) { a.href = url; a.target = "_blank"; a.rel = "noopener"; return true; }
    return false;
  }

  function openHunter(store, d) {
    var sheet = $("sheet");
    sheet.textContent = "";
    sheet.appendChild(el("h3", null, d.title || "Item " + d.item_id));
    sheet.appendChild(el("div", "big", money(d.price) || "Price unknown"));
    if (d.was != null && d.pct_off != null) {
      sheet.appendChild(el("div", "kv", "was " + money(d.was) + " · " + d.pct_off + "% off · saves " + money(d.saves)));
    }
    sheet.appendChild(el("div", "kv", (d.qty != null ? d.qty + " reported in stock" : "Quantity not reported") +
      " · item " + d.item_id));
    sheet.appendChild(el("div", "kv", (store.name || "Store") + " #" + store.id));
    if (d.confidence) {
      sheet.appendChild(el("div", "kv", "Stock confidence: " + d.confidence.label + " " + d.confidence.score +
        ((d.confidence.tags || []).length ? " (" + d.confidence.tags.join(", ") + ")" : "")));
    }
    var upc = window.HDBarcode ? HDBarcode.normalize(d.upc) : null;
    if (upc) {
      var box = el("div", "barcode");
      box.appendChild(HDBarcode.svg(upc));
      sheet.appendChild(box);
      sheet.appendChild(el("div", "kv", "Scan this at a price checker or the Home Depot app to see the live shelf price."));
    } else {
      sheet.appendChild(el("div", "kv", "No valid barcode on record for this item."));
    }
    sheet.appendChild(el("div", "kv", "Estimate only: confirm the price and stock in store."));
    var btns = el("div", "btns");
    var ghost = isGhost(store, d);
    var gb = el("button", null, ghost ? "Show this again" : "Not on the shelf (hide 48 h)");
    gb.onclick = function () { setGhost(store, d, !ghost); closeHunter(); renderTabs(); renderDeals(); };
    btns.appendChild(gb);
    var item = el("a", "btn", "Item page");
    if (safeLink(item, d.url, /^https:\/\/www\.homedepot\.com\//)) btns.appendChild(item);
    var where = el("a", "btn", "Directions");
    var place = store.place || {};
    if (safeLink(where, place.maps_url, /^https:\/\/www\.google\.com\/maps\//)) btns.appendChild(where);
    var close = el("button", "primary", "Close");
    close.onclick = closeHunter;
    btns.appendChild(close);
    sheet.appendChild(btns);
    $("hunter").classList.add("open");
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {}
  }
  function closeHunter() { $("hunter").classList.remove("open"); }
  $("hunter").addEventListener("click", function (e) { if (e.target === this) closeHunter(); });

  function renderWorth() {
    var box = $("worth");
    box.textContent = "";
    if (data.stores.length < 2) { box.hidden = true; return; }
    box.hidden = false;
    box.appendChild(el("h2", null, "Worth the drive?"));
    var ranked = data.stores.slice().sort(function (x, y) { return y.worth.savings - x.worth.savings; });
    ranked.forEach(function (s) {
      var row = el("div", "wrow");
      var left = el("div");
      left.appendChild(el("div", null, (s.name || "Store") + " #" + s.id));
      var w = s.worth;
      left.appendChild(el("div", "meta", w.deals
        ? w.deals + " confident deal" + (w.deals === 1 ? "" : "s") + " · " + money(w.savings) + " off" +
          (w.best ? " · best: " + money(w.best.saves) + " off" : "")
        : "No confident deals right now"));
      row.appendChild(left);
      var v = el("span", "verdict" + (w.worth ? " yes" : ""), w.worth ? "Worth a trip" : "Not yet");
      v.title = "Needs " + w.min_deals + "+ confident deals worth " + money(w.min_savings) + "+ combined";
      row.appendChild(v);
      box.appendChild(row);
    });
    box.appendChild(el("div", "meta", "A rule of thumb from stock-confident deals only. It does not know your drive time."));
  }

  function renderDeals() {
    var box = $("deals");
    box.textContent = "";
    var store = data.stores.filter(function (s) { return s.id === current; })[0];
    if (!store) return;
    var hid = hiddenCount(store);
    $("hidden-note").hidden = hid === 0;
    $("hidden-toggle").textContent = showHidden
      ? "Hide the " + hid + " you marked not on the shelf"
      : hid + " hidden as not on the shelf. Show";
    var deals = visible(store);
    if (!deals.length) {
      box.appendChild(el("p", "empty", data.run.degraded.length
        ? "Nothing listed for this store, but the last scan was incomplete."
        : "No clearance deals recorded at this store right now."));
      return;
    }
    deals.forEach(function (d) {
      var card = el("div", "deal");
      var row = el("a", "row");
      // Only ever link to Home Depot.
      safeLink(row, d.url, /^https:\/\/www\.homedepot\.com\//);
      if (/^https:\/\//.test(d.image_url || "")) {
        var img = el("img"); img.src = d.image_url; img.alt = ""; img.loading = "lazy";
        row.appendChild(img);
      }
      var body = el("div", "body");
      var title = el("p", "title", d.title);
      if (isGhost(store, d)) title.appendChild(el("span", "badge low", "hidden"));
      if (d.is_new) title.appendChild(el("span", "tag", "New"));
      if (d.confidence) {
        var c = d.confidence;
        var bd = el("span", "badge " + c.label.toLowerCase(), c.label + " " + c.score);
        bd.title = (c.tags || []).join(" · ");
        title.appendChild(bd);
      }
      body.appendChild(title);
      var line = el("div");
      line.appendChild(el("span", "price", money(d.price) || "Price unknown"));
      if (d.was != null && d.pct_off != null) {
        line.appendChild(el("span", "was",
          "was " + money(d.was) + " · " + d.pct_off + "% off · saves " + money(d.saves)));
      } else {
        line.appendChild(el("span", "was", "was-price unknown"));
      }
      body.appendChild(line);
      var stock = d.qty != null ? d.qty + " in stock"
        : (d.in_stock ? "In stock, quantity not reported" : "Stock unknown");
      body.appendChild(el("div", "meta",
        stock + " · item " + d.item_id + " · read " + when(d.retrieved_at)));
      var extra = [];
      if (d.cadence && d.cadence.ending && d.cadence.label) {
        extra.push("price ends " + d.cadence.ending + " (" + d.cadence.label +
          (d.cadence.days_at_price != null ? ", " + d.cadence.days_at_price + " d at this price" : "") + ")");
      }
      if (d.confidence && d.confidence.tags && d.confidence.tags.length) {
        extra.push(d.confidence.tags.join(", "));
      }
      if (extra.length) body.appendChild(el("div", "meta", extra.join(" · ")));
      if (d.context && d.context.inflated) {
        body.appendChild(el("div", "flag", "Inflated discount: " + d.context.claimed_pct +
          "% off the listed price, but only " + d.context.true_pct + "% off its usual " +
          money(d.context.typical_price)));
      }
      row.appendChild(body);
      card.appendChild(row);
      var actions = el("div", "actions");
      var hunt = el("button", "primary", "Hunter card");
      hunt.onclick = function () { openHunter(store, d); };
      actions.appendChild(hunt);
      var ghosted = isGhost(store, d);
      var fb = el("button", null, ghosted ? "Show again" : "Not on the shelf");
      fb.onclick = function () { setGhost(store, d, !ghosted); renderTabs(); renderDeals(); };
      actions.appendChild(fb);
      card.appendChild(actions);
      box.appendChild(card);
    });
  }

  function renderTabs() {
    var tabs = $("tabs");
    tabs.textContent = "";
    data.stores.forEach(function (s) {
      var b = el("button", null,
        (s.name || "Store") + " #" + s.id + " (" + visible(s).length + ")");
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(s.id === current));
      b.onclick = function () { current = s.id; renderTabs(); renderDeals(); };
      tabs.appendChild(b);
    });
  }

  $("hidden-toggle").onclick = function () { showHidden = !showHidden; renderTabs(); renderDeals(); };

  // ── Install + offline
  var installEvent = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); installEvent = e; $("install").hidden = false;
  });
  $("install-btn").onclick = function () {
    if (installEvent) { installEvent.prompt(); installEvent = null; $("install").hidden = true; }
  };
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  fetch("deals.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      data = d;
      if (!d.run || !d.run.started) {
        $("sub").textContent = "No scan has been published yet.";
        banner("Waiting for the first scan",
          ["Run the scanner on your Mac; this page fills in after it finishes."]);
        return;
      }
      $("sub").textContent = "Last scan " + when(d.run.started) + " · " + ago(d.run.started);
      var hours = (Date.now() - new Date(d.run.started).getTime()) / 3600000;
      if (hours > 14) {
        banner("This page is out of date",
          ["The last scan was " + ago(d.run.started) +
           ". Check that the scanner is still running on your Mac."]);
      }
      if (d.run.degraded && d.run.degraded.length) {
        var reasons = d.run.degraded.slice();
        reasons.push(d.run.last_complete
          ? "Last complete scan: " + when(d.run.last_complete) + " (" + ago(d.run.last_complete) + ")."
          : "No complete scan has been published yet.");
        banner("The last scan did not see everything", reasons);
      }
      current = d.stores.length ? d.stores[0].id : null;
      if (d.no_bs && d.no_bs.enabled) {
        $("filter").hidden = false;
        $("nobs").checked = hideLow;
        $("nobs").onchange = function () {
          hideLow = this.checked;
          try { localStorage.setItem("hideLow", hideLow ? "1" : "0"); } catch (e) {}
          renderTabs(); renderDeals();
        };
      }
      renderWorth();
      renderTabs();
      renderDeals();
      var foot = d.run.snapshots + " price readings · " + d.run.requests + " requests";
      if (d.min_dollar_off > 0) foot += " · hiding savings under " + money(d.min_dollar_off);
      $("foot").textContent = foot + ". " + (d.disclaimer || "Prices are what the scanner recorded; confirm in store.");
    })
    .catch(function (e) {
      $("sub").textContent = "Could not load the latest scan.";
      banner("Deals data is unavailable", [String(e.message || e)]);
    });
})();
</script>
</body>
</html>

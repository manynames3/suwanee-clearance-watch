name: Schema canary

# Offline: validates the recorded Home Depot response against the typed
# contract in src/hd/hd_api/schema.py and proves the drift detector still
# catches renamed, dropped and re-typed fields. It makes no request to Home
# Depot. To check the LIVE shape, run `hd canary` on your own machine (one
# ordinary search request).

on:
  push:
    paths:
      - "src/hd/hd_api/**"
      - "tests/fixtures/**"
      - "tests/test_phase5_schema.py"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_phase5_schema.py tests/test_parsers.py
